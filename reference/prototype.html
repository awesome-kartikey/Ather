<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floor Trainer – Warehouse prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Noto+Sans:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfe5e8;--card:#fff;--ink:#14232b;--ok:#1f8a4c;--no:#d23b30;--act:#ee6a1f;--wood:#b88a55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191e;--card:#1a272e;--ink:#eef3f5;--ok:#43c27a;--no:#ff6b5e;--act:#ff8a4a;--wood:#9a7344}}
:root[data-theme="dark"]{--bg:#10191e;--card:#1a272e;--ink:#eef3f5;--ok:#43c27a;--no:#ff6b5e;--act:#ff8a4a;--wood:#9a7344}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 20px/1.4 'Noto Sans','Noto Sans Devanagari',sans-serif}
h1,h2{font-family:'Barlow Condensed','Noto Sans Devanagari',sans-serif;font-weight:700;margin:0;line-height:1.15}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 20px;border-bottom:3px solid var(--ink)}
.bar h1{font-size:30px}
.seg{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:10px 16px;min-width:56px;text-align:center;font-weight:700}
.seg .on{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:12px;flex-wrap:wrap}
main{max-width:1100px;margin:0 auto;padding:20px}
.note{margin:0 0 20px;color:var(--ink);opacity:.75}
.home,.stage{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.pack{all:unset;cursor:pointer;display:block;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:28px;box-shadow:6px 6px 0 var(--ink)}
.pack:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}
.pack .big{font-size:64px}.pack h2{font-size:38px;margin:8px 0}
.slots{display:flex;gap:6px;margin-bottom:16px}
.slots i{flex:1;height:18px;border-radius:3px;background:var(--wood);opacity:.35;border:2px solid var(--ink)}
.slots i.cur{opacity:1}.slots i.ok{background:var(--ok);opacity:1}.slots i.no{background:var(--no);opacity:1}
.q{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:22px}
.q h2{font-size:36px}
.say{all:unset;cursor:pointer;margin-top:14px;display:inline-block;padding:8px 16px;border:2px solid var(--ink);border-radius:10px;font-weight:700}
.opts{display:grid;gap:14px}
.tile{all:unset;cursor:pointer;display:flex;align-items:center;gap:16px;min-height:72px;padding:12px 18px;background:var(--card);border:3px solid var(--ink);border-radius:12px;font-size:22px;font-weight:700}
.tile .ic{font-size:40px;position:relative}
.tile .ic b{position:absolute;right:-8px;top:-8px;font-size:20px}
.tile.hint{outline:4px solid var(--act);outline-offset:3px}
.tile.ok{background:var(--ok);color:#fff}.tile.no{background:var(--no);color:#fff}
.fb{margin-top:16px;padding:16px;border-radius:12px;border:3px solid var(--ink);background:var(--card)}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--no)}
.fb strong{display:block;font-size:24px;margin-bottom:4px}
.btn{all:unset;cursor:pointer;display:inline-block;margin-top:14px;background:var(--act);color:#10191e;font-weight:700;font-size:24px;padding:16px 32px;border-radius:12px;border:3px solid var(--ink);text-align:center}
.pile{display:flex;flex-wrap:wrap;gap:4px;font-size:30px;margin-top:14px}
.cnt{display:flex;align-items:center;justify-content:center;gap:24px;margin:8px 0}
.cnt .tile{width:84px;justify-content:center;font-size:44px;padding:0}
.cnt span{font:700 72px 'Barlow Condensed',sans-serif;min-width:90px;text-align:center}
.done{text-align:center}.done .st{font-size:72px}
.hud{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-weight:700}
.hud span{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 14px}
.xpb{height:14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--card);margin-bottom:12px}.xpb i{display:block;height:100%;background:var(--act)}
.opts.g{grid-template-columns:1fr 1fr}.opts.g .tile{flex-direction:column;text-align:center;justify-content:center}.opts.g .ic{font-size:56px}
.scn{font:700 28px 'Barlow Condensed',sans-serif;background:#10191e;color:#7cffb0;border-radius:8px;padding:8px 14px;margin-top:14px;display:inline-block}
.bcd{display:block;width:110px;height:44px;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 6px,var(--ink) 6px 7px,transparent 7px 11px)}
.tile.ok .bcd,.tile.no .bcd{filter:invert(1)}
.seq{display:grid;gap:10px;margin-bottom:12px}.seq .tile{min-height:60px;border-style:dashed}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.zone{min-height:150px;border:3px dashed var(--ink);border-radius:12px;padding:10px;text-align:center;font-weight:700;background:var(--card)}
.zone .ic{font-size:36px}
.item{touch-action:none;cursor:grab;user-select:none}.item.sel{outline:4px solid var(--act)}
.ghost{position:fixed;pointer-events:none;z-index:9;font-size:48px;transform:translate(-50%,-50%)}
.chips{display:flex;gap:8px;flex-wrap:wrap;font-size:34px;justify-content:center}
.cert{border:4px double var(--ink);background:var(--card);padding:20px;border-radius:12px;max-width:560px;margin:16px auto}
input.nm{font:inherit;padding:10px 14px;border:3px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);max-width:220px}
.demo{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:12px;max-width:900px;margin:0 auto}
.demo svg{width:100%;height:auto;display:block}
.cap{font:700 32px/1.2 'Barlow Condensed','Noto Sans Devanagari',sans-serif;margin:10px 4px;min-height:80px}
.fi{fill:var(--ink)}.fc{fill:var(--card)}.fw{fill:var(--wood)}.fo{fill:var(--ok)}.fn{fill:var(--no)}.fa{fill:var(--act)}.si{stroke:var(--ink);stroke-width:3}
@keyframes sIn{from{transform:translateX(-420px)}to{transform:none}}
@keyframes dr{from{transform:translateY(-120px);opacity:0}to{transform:none;opacity:1}}
@keyframes pp{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes go{from{transform:none}to{transform:var(--m)}}
@keyframes fl{0%,100%{opacity:.25}50%{opacity:1}}
.sIn{animation:sIn 1.6s ease-out both}.dr{animation:dr .8s ease-out both}.pp{animation:pp .5s ease-out both;transform-box:fill-box;transform-origin:center}
.mv{animation:go 2s ease-in-out both}.fl{animation:fl 1s infinite}
.d1{animation-delay:.6s}.d2{animation-delay:1.4s}.d3{animation-delay:2.2s}.d4{animation-delay:3s}
@media(prefers-reduced-motion:reduce){.demo *{animation-duration:.01s!important;animation-delay:0s!important}}
:focus-visible{outline:4px solid var(--act);outline-offset:3px}
@media(max-width:760px){.home,.stage{grid-template-columns:1fr}}
</style></head>

 const next=()=>{if(mode&&lives<=0)return end(true);if(i+1<pack.s.length){setI(i+1);rst();return}end(false)};
 const bar=html`<div class="bar"><h1>🏭 ${t(UI.title)}</h1><div class="tools">
  <div class="seg">${[0,1].map(m=>html`<button key=${m} class=${mode===m?'on':''} onClick=${()=>setMode(m)}>${t(m?UI.p:UI.g)}</button>`)}</div>
  <div class="seg">${LN.map((x,k)=>html`<button key=${k} class=${lg===k?'on':''} onClick=${()=>setLg(k)}>${x}</button>`)}</div></div></div>`;
 if(demo)return html`${bar}<main><${Demo} k=${demo.k} lg=${lg} run=${demo.run} onDone=${()=>{const d=demo;setDemo(null);if(d.run)start(d.k)}}/></main>`;
 if(!pk){const nx=LX[lvl+1],pc=nx?(pf.xp-LX[lvl])/(nx-LX[lvl])*100:100;
  return html`${bar}<main><p class="note">${t(UI.sub)}</p>
  <div class="hud"><input class="nm" placeholder=${t(UI.nm)} value=${pf.name} onInput=${e=>sv(Object.assign({},pf,{name:e.target.value}))}/><span>${t(LV[lvl])} · ${pf.xp} ${t(UI.xp)}</span><span>🔥 ${pf.streak||0} ${t(UI.day)}</span></div>
  <div class="xpb"><i style=${{width:pc+'%'}}></i></div>
  <div class="chips">${pf.bd.map(b=>html`<span key=${b} title=${t(BG[b][1])}>${BG[b][0]}</span>`)}</div>
  <div class="home" style=${{marginTop:'16px'}}>${Object.keys(P).map(k=>html`<button key=${k} class="pack" onClick=${()=>mode?start(k):setDemo({k,run:1})}><div class="big">${P[k].ic}</div><h2>${t(P[k].n)}</h2><div>${pf.best[k]?t(UI.best)+': '+'⭐'.repeat(pf.best[k]):' '}</div></button>`)}</div>
  <div class="chips" style=${{marginTop:'20px'}}>${Object.keys(P).map(k=>html`<button key=${k} class="btn" onClick=${()=>setDemo({k})}>▶ ${t(UI.watch)}: ${t(P[k].n)}</button>`)}</div>
  <h2 style=${{margin:'24px 0 8px'}}>${t(UI.top)}</h2><div class="home">${Object.keys(P).map(k=>html`<div key=${k}><b>${t(P[k].n)}</b><ol>${(pf.top[k]||[]).map((r,j)=>html`<li key=${j}>${r.n} · ${r.x} ${t(UI.xp)}</li>`)}</ol></div>`)}</div></main>`}
 if(done)return html`${bar}<main class="done"><div class="st">${done.lost?'💔':'⭐'.repeat(done.st)}</div><h2>${t(pack.n)}</h2>
  <p>${done.lost?t(UI.over):'+'+done.gain+' '+t(UI.xp)}</p>
  <div class="chips">${done.bd.map(b=>html`<span key=${b}>${BG[b][0]}</span>`)}</div><p>${done.bd.map(b=>t(BG[b][1])).join(' · ')}</p>
  ${res.some(r=>!r.ok&&r.s)?html`<p>${t(UI.sNo)}</p>`:''}
  ${done.bd.includes('cert')?html`<div class="cert"><h2>🏅 ${pf.name||'—'}</h2><div>${t(pack.n)} · ${new Date().toLocaleDateString()}</div><p>${t(UI.cert)}</p><div>Supervisor: ______________</div></div>`:''}
  <button class="btn" onClick=${()=>start(pk)}>${t(UI.re)}</button> <button class="btn" onClick=${()=>setPk(null)}>${t(UI.home)}</button></main>`;
 const choice=html`<div class=${'opts'+(s.k==='g'?' g':'')}>${opts.map((x,k)=>html`<button key=${k} class=${'tile'+(pick&&pick.pk===k?(x.ok?' ok':' no'):'')+(pick&&x.ok&&!pick.ok?' ok':'')+(!pick&&mode===0&&x.ok?' hint':'')} onClick=${()=>fin(!!x.ok,{pk:k})}>${s.k==='bc'?html`<span class="bcd"></span>`:html`<span class="ic">${x.i}${x.d?html`<b>💥</b>`:''}</span>`}${t(x.l)}</button>`)}</div>`;
 const count=html`<div class="cnt"><button class="tile" disabled=${!!pick} onClick=${()=>setN(Math.max(0,n-1))}>−</button><span>${n}</span><button class="tile" disabled=${!!pick} onClick=${()=>setN(n+1)}>+</button></div>${!pick?html`<button class="btn" onClick=${()=>fin(n===s.c)}>${t(UI.chk)}</button>`:''}`;
 const seq=s.a&&html`<div class="seq">${ord.map((x,k)=>html`<button key=${x} class="tile" disabled=${!!pick} onClick=${()=>setOrd(ord.filter(y=>y!==x))}>${k+1}. ${t(s.a[x])}</button>`)}</div>
  <div class="opts">${sq.filter(x=>!ord.includes(x)).map(x=>html`<button key=${x} class="tile" disabled=${!!pick} onClick=${()=>setOrd(ord.concat(x))}>${t(s.a[x])}</button>`)}</div>
  ${!pick&&ord.length===s.a.length?html`<button class="btn" onClick=${()=>fin(ord.every((x,k)=>x===k))}>${t(UI.chk)}</button>`:''}`;
 const drag=s.d&&html`<p class="note">${t(UI.dh)}</p><div class="opts">${s.d.it.map((x,k)=>dd.pl[k]!=null?'':html`<button key=${k} class=${'tile item'+(sel===k?' sel':'')} onPointerDown=${e=>setDr({k,sx:e.clientX,sy:e.clientY})} onClick=${()=>setSel(k)}><span class="ic">${x.i}</span>${t(x.l)}</button>`)}</div>
  <div class="zones">${s.d.z.map(z=>html`<div key=${z.id} class="zone" data-z=${z.id} onClick=${()=>sel!=null&&drop(z.id,sel)}><span class="ic">${z.i}</span><div>${t(z.l)}</div><div class="chips">${s.d.it.map((x,k)=>dd.pl[k]===z.id?html`<span key=${k}>${x.i}</span>`:'')}</div></div>`)}</div>`;
 return html`${bar}<main>
  <div class="hud"><span>${t(LV[lvl])} · ${pf.xp+rx} ${t(UI.xp)}</span>${mode?html`<span>${'❤️'.repeat(Math.max(lives,0))||'💔'}</span>`:''}${combo>1?html`<span>🔥 ×${combo}</span>`:''}</div>
  <div class="slots">${pack.s.map((_,k)=>html`<i key=${k} class=${k<res.length?(res[k].ok?'ok':'no'):k===i?'cur':''}></i>`)}</div>
  <div class="stage"><div class="q"><h2>${t(s.q)}</h2>
   <button class="say" onClick=${()=>say(t(s.q))}>${t(UI.listen)}</button>
   ${s.po?html`<div class="scn">PO · ${s.po}</div>`:''}
   ${s.c?html`<div class="pile">${Array(s.c).fill('📦').map((b,k)=>html`<span key=${k}>${b}</span>`)}</div>`:''}</div>
  <div>${s.c?count:s.a?seq:s.d?drag:choice}
   ${pick?html`<div class=${'fb '+(pick.ok?'ok':'no')}><strong>${t(pick.ok?UI.good:UI.bad)}</strong>${t(s.w)}<br/><button class="btn" onClick=${next}>${t(UI.nx)}</button></div>`:''}
  </div></div>${dr&&dr.x!=null&&s.d?html`<div class="ghost" style=${{left:dr.x,top:dr.y}}>${s.d.it[dr.k].i}</div>`:''}</main>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script></body></html>
