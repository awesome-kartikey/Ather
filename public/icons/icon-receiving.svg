<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Circular Ring -->
  <circle cx="256" cy="230" r="160" fill="#022c22" opacity="0.4" />
  
  <!-- Inbound Receiving Dock / Cargo Icon -->
  <!-- Dock Floor / Ramp -->
  <rect x="96" y="340" width="320" height="24" rx="6" fill="#6ee7b7" />
  <rect x="120" y="364" width="32" height="40" rx="4" fill="#34d399" />
  <rect x="360" y="364" width="32" height="40" rx="4" fill="#34d399" />
  
  <!-- Main Inbound Warehouse Box / Pallet -->
  <rect x="176" y="190" width="160" height="135" rx="16" fill="#f8fafc" />
  <path d="M176 240 L336 240" stroke="#047857" stroke-width="8" stroke-dasharray="16 12" />
  <path d="M256 190 L256 325" stroke="#047857" stroke-width="8" />
  
  <!-- Downward Inbound Arrow (Receiving & Put-Away) -->
  <path d="M256 90 L256 165" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" />
  <path d="M220 135 L256 170 L292 135" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Badge Tag -->
  <rect x="110" y="420" width="292" height="48" rx="24" fill="#10b981" />
  <text x="256" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">RECEIVING &amp; PUT-AWAY</text>
</svg>